<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub XP On</title>
<meta name="description" content="Hub do marketing da XP On: sites, landing pages, apresentações, arquivos, calendário de posts, eventos e pedidos de material.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hub.css">
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-controls="rail" aria-expanded="false">
    <span class="menu-ico" aria-hidden="true"></span><span class="sr">Abrir menu</span>
  </button>
  <a href="#/inicio" class="topbar-logo" aria-label="Hub XP On, início"><span class="logo-slot"></span></a>
</header>

<aside class="rail" id="rail">
  <a href="#/inicio" class="rail-logo" aria-label="Hub XP On, início">
    <span class="logo-slot"></span>
    <span>Hub</span>
  </a>
  <nav aria-label="Áreas do Hub" id="nav"></nav>
  <div class="rail-foot">
    <button class="link-btn" id="tourBtn" type="button">Ver o tour de novo</button>
    <p class="rail-meta" id="railMeta"></p>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<main id="conteudo" tabindex="-1"></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm" novalidate aria-labelledby="gateTitle">
    <div class="gate-logo"><span class="logo-slot"></span></div>
    <h2 id="gateTitle">Bem-vindo ao Hub XP On</h2>
    <p>Diga quem é você para entrar. É um registro interno: serve para o marketing saber quem já acessou o Hub.</p>
    <label for="gNome">Nome e sobrenome</label>
    <input id="gNome" name="nome" autocomplete="name" required>
    <label for="gEmail">E-mail da XP On</label>
    <input id="gEmail" name="email" type="email" autocomplete="email" placeholder="nome.sobrenome@xpon.com.br" required>
    <label for="gArea">Área</label>
    <select id="gArea" name="area" required>
      <option value="">Escolha a sua área</option>
      <option>Diretoria</option><option>Comercial</option><option>Pré-vendas</option><option>CX e relacionamento</option>
      <option>Marketing</option><option>Financeiro</option><option>Administrativo e RH</option><option>Compras</option>
      <option>Suporte e projetos</option><option>Outra</option>
    </select>
    <p class="gate-err" id="gateErr" hidden></p>
    <button class="btn gate-btn" type="submit">Entrar no Hub</button>
  </form>
</div>
<form name="acesso-hub" data-netlify="true" netlify-honeypot="bot" hidden>
  <input name="nome"><input name="email"><input name="area"><input name="tipo"><input name="navegador"><input name="bot">
</form>

<div class="tour" id="tour" hidden>
  <div class="tour-spot" id="tourSpot"></div>
  <div class="tour-card" id="tourCard" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
    <p class="tour-step" id="tourStep"></p>
    <h2 id="tourTitle"></h2>
    <p id="tourText"></p>
    <div class="tour-actions">
      <button type="button" class="link-btn" id="tourSkip">Pular o tour</button>
      <span class="tour-nav">
        <button type="button" class="btn ghost" id="tourBack">Voltar</button>
        <button type="button" class="btn" id="tourNext">Próximo</button>
      </span>
    </div>
  </div>
</div>


<script src="assets/data.js"></script>
<script src="assets/hub.js"></script>
</body>
</html>
